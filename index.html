<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capholder // PORTFOLIO_OS v0.1</title>
  <!-- Privacy-friendly аналог Google Fonts без логирования IP (GDPR-safe) -->
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=jetbrains-mono:400,500,700|tektur:600,700,800,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <div class="os-container">
    <!-- Растягивающаяся белая HUD-рамка -->
    <svg class="hud-frame" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">
      <path
        d="M 18 10 L 810 10 L 826 24 L 892 24 L 908 10 L 982 10 L 990 18 L 990 315 L 976 335 L 976 635 L 990 655 L 990 982 L 982 990 L 185 990 L 168 976 L 95 976 L 78 990 L 18 990 L 10 982 L 10 665 L 24 645 L 24 345 L 10 325 L 10 18 Z"
        fill="none"
        stroke="rgba(235, 242, 255, 0.78)"
        stroke-width="1.6"
        vector-effect="non-scaling-stroke"
      />
    </svg>

    <!-- Фоновые неоновые пятна и декоративный код -->
    <div class="ambient-glow ambient-glow--mint" aria-hidden="true"></div>
    <div class="ambient-glow ambient-glow--pink" aria-hidden="true"></div>

    <pre class="bg-code bg-code--left" aria-hidden="true">import random
names = ["world", "friend", "dev"]
print(f"Hello, {random.choice(names)}!")</pre>

    <pre class="bg-code bg-code--right" aria-hidden="true">total = sum(range(1, 101))
print("Enter number 1 - 100:")
print(total)</pre>

    <!-- Верхняя панель -->
    <header class="os-header">
      <div class="top-left-hud">
        <nav class="social-links" aria-label="Контакты">
          <a href="https://github.com/caprricorn" target="_blank" rel="noopener noreferrer" class="hud-btn hud-btn--mint">GITHUB</a>
          <a href="https://t.me/DOQDKX" target="_blank" rel="noopener noreferrer" class="hud-btn hud-btn--mint">TELEGRAM</a>
          <a href="mailto:caprpricorn313@gmail.com" class="hud-btn hud-btn--pink">EMAIL</a>
        </nav>
        <div class="os-version">PORTFOLIO_OS v0.1</div>
      </div>
    </header>

    <!-- Главный заголовок -->
    <section class="hero">
      <h1 class="hero-title">CAPHOLDER</h1>
      <p class="hero-subtitle">PROJECTS</p>
    </section>

    <!-- Контейнер карточек из projects.js -->
    <main class="projects-stage">
      <!-- Капри сидит на верхнем правом углу первой карточки -->
      <img src="capri.png" alt="" class="capri-art" aria-hidden="true">

      <div id="projects-list" class="projects-list"></div>
    </main>
  </div>

  <script src="projects.js"></script>
  <script>
    (function () {
      const container = document.getElementById('projects-list');
      if (!container || typeof PROJECTS === 'undefined' || !Array.isArray(PROJECTS)) {
        return;
      }

      container.innerHTML = PROJECTS.map((project, index) => {
        const num = String(index + 1).padStart(2, '0');
        const isLive = project.status && project.status.toUpperCase() === 'LIVE DEMO' && project.url;
        const cardClass = isLive ? 'project-card project-card--live' : 'project-card project-card--soon';
        const statusClass = isLive ? 'status-badge status-badge--live' : 'status-badge status-badge--soon';

        const tagsHtml = (project.tags || [])
          .map(tag => `<span class="tech-tag">${tag}</span>`)
          .join('');

        const actionHtml = isLive
          ? `<a href="${project.url}" target="_blank" rel="noopener noreferrer" class="open-btn">ОТКРЫТЬ -&gt;</a>`
          : `<span class="open-btn open-btn--disabled">В РАЗРАБОТКЕ</span>`;

        return `
          <article class="${cardClass}">
            <div class="card-header">
              <div class="card-title-group">
                <span class="card-index">${num} //</span>
                <h2 class="card-title">${project.title}</h2>
              </div>
              <div class="card-meta">
                <div class="tags-row">${tagsHtml}</div>
                <span class="${statusClass}">${project.status || 'SOON'}</span>
              </div>
            </div>
            <div class="card-body">
              <p class="card-desc">${project.description || ''}</p>
              <div class="card-actions">${actionHtml}</div>
            </div>
          </article>
        `;
      }).join('');
    })();
  </script>
</body>
</html>
