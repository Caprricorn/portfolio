<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTFOLIO_OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Russo+One&family=Tektur:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="hud-frame" aria-hidden="true">
    <svg class="hud-svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
      <polygon
        class="hud-border"
        points="24,24 1575,24 1592,38 1732,38 1749,24 1896,24 1896,356 1868,376 1868,708 1896,728 1896,1056 346,1056 329,1042 186,1042 169,1056 24,1056 24,728 52,708 52,376 24,356"
      />
    </svg>
  </div>

  <main class="os-container">
    <header class="os-header">
      <div class="system-status">
        <p class="status-prompt">Выберите проект</p>
        <p class="status-version">PORTFOLIO_OS v0.1</p>
      </div>

      <div class="hero-title-group">
        <h1 class="hero-title">
          <span>ДОБРО</span>
          <span>ПОЖАЛОВАТЬ</span>
        </h1>
        <h2 class="hero-subtitle">МОИ ПРОЕКТЫ</h2>
      </div>
    </header>

    <div class="bg-code bg-code-top" aria-hidden="true">
<pre>import random
names = ["world", "friend", "cat"]
print(f"Hello, {random.choice(names)}!")</pre>
    </div>

    <div class="bg-code bg-code-right" aria-hidden="true">
<pre>total = sum(range(1, 101))
print("enter number 1 - 100:")
print(total)</pre>
    </div>

    <section class="projects-grid" id="projects-grid" aria-label="Список проектов"></section>
  </main>

  <script src="projects.js"></script>
  <script>
    (function () {
      const grid = document.getElementById('projects-grid');
      if (!grid || typeof PROJECTS === 'undefined' || !Array.isArray(PROJECTS)) {
        return;
      }

      const fragment = document.createDocumentFragment();

      PROJECTS.forEach((project, index) => {
        const wrapper = document.createElement('article');
        wrapper.className = 'project-card-wrapper';

        if (index === 2) {
          wrapper.classList.add('project-card-wrapper--right');
          const capriImg = document.createElement('img');
          capriImg.src = 'caprismol.png';
          capriImg.alt = 'Capri';
          capriImg.className = 'capri-overlay';
          wrapper.appendChild(capriImg);
        }

        const rawUrl = typeof project.url === 'string' ? project.url.trim() : '#';
        const isExternal = /^https?:\/\//i.test(rawUrl);
        const safeUrl = isExternal || rawUrl.startsWith('#') || rawUrl.startsWith('/') ? rawUrl : '#';
        const isPlaceholder = safeUrl === '#';

        const cardLink = document.createElement('a');
        cardLink.className = 'project-card';
        if (isPlaceholder) {
          cardLink.classList.add('project-card--soon');
          cardLink.setAttribute('aria-disabled', 'true');
          cardLink.addEventListener('click', (event) => event.preventDefault());
        }
        cardLink.href = safeUrl;
        cardLink.setAttribute('aria-label', project.title || `Проект ${index + 1}`);

        if (isExternal) {
          cardLink.target = '_blank';
          cardLink.rel = 'noopener noreferrer';
        }

        const inner = document.createElement('div');
        inner.className = 'project-card-inner';

        // Верхняя панель карточки: номер и статус
        const cardHeader = document.createElement('div');
        cardHeader.className = 'card-header';

        const cardIndex = document.createElement('span');
        cardIndex.className = 'card-index';
        cardIndex.textContent = `${String(index + 1).padStart(2, '0')} //`;

        const statusText = typeof project.status === 'string' && project.status.trim()
          ? project.status.trim()
          : (isPlaceholder ? 'SOON' : 'LIVE');

        const cardStatus = document.createElement('span');
        cardStatus.className = 'card-status';
        if (statusText.toUpperCase() === 'LIVE DEMO' || (!isPlaceholder && statusText.toUpperCase() !== 'SOON')) {
          cardStatus.classList.add('card-status--live');
        } else {
          cardStatus.classList.add('card-status--soon');
        }
        cardStatus.textContent = statusText;

        cardHeader.appendChild(cardIndex);
        cardHeader.appendChild(cardStatus);

        // Основной контент: заголовок и описание
        const cardBody = document.createElement('div');
        cardBody.className = 'card-body';

        const cardTitle = document.createElement('h3');
        cardTitle.className = 'card-title';
        cardTitle.textContent = project.title || 'Без названия';

        const cardDescription = document.createElement('p');
        cardDescription.className = 'card-description';
        cardDescription.textContent = project.description || '';

        cardBody.appendChild(cardTitle);
        cardBody.appendChild(cardDescription);

        // Нижняя панель: теги и кнопка перехода
        const cardFooter = document.createElement('div');
        cardFooter.className = 'card-footer';

        const tagsList = document.createElement('ul');
        tagsList.className = 'card-tags';

        const tags = Array.isArray(project.tags) ? project.tags : [];
        tags.forEach((tag) => {
          const tagItem = document.createElement('li');
          tagItem.className = 'card-tag';
          tagItem.textContent = String(tag);
          tagsList.appendChild(tagItem);
        });

        const cardAction = document.createElement('span');
        cardAction.className = 'card-action';
        if (isPlaceholder) {
          cardAction.classList.add('card-action--muted');
        }
        cardAction.textContent = 'ОТКРЫТЬ ->';

        cardFooter.appendChild(tagsList);
        cardFooter.appendChild(cardAction);

        inner.appendChild(cardHeader);
        inner.appendChild(cardBody);
        inner.appendChild(cardFooter);

        cardLink.appendChild(inner);
        wrapper.appendChild(cardLink);
        fragment.appendChild(wrapper);
      });

      grid.appendChild(fragment);
    })();
  </script>
</body>
</html>
